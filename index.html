<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfumería · Gestión de Decants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17131b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decants">
<style>
:root{
  --ink:#17131b;
  --ink-soft:#241f2b;
  --cream:#f7f2ea;
  --paper:#fffdf9;
  --gold:#c69a3e;
  --gold-soft:#e7c887;
  --plum:#4a2545;
  --rose:#b5677d;
  --teal:#2c4c5c;
  --text:#231f28;
  --muted:#8a8190;
  --border:#e9e1d3;
  --danger:#b3453f;
  --success:#3f7a51;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 10px 30px -12px rgba(23,19,27,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'DM Mono',monospace;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--ink);color:var(--cream);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px 10px;border-bottom:1px solid rgba(247,242,234,.12);margin-bottom:16px;}
.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--gold);flex-shrink:0;}
.brand-logo-fallback{width:38px;height:38px;border-radius:50%;background:linear-gradient(155deg,var(--gold),var(--plum));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);font-size:18px;}
.brand-text{overflow:hidden;}
.brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:15.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-soft);opacity:.8;}
nav{display:flex;flex-direction:column;gap:3px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;
  background:transparent;color:rgba(247,242,234,.72);text-align:left;font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-item i{font-size:17px;width:18px;text-align:center;}
.nav-item:hover{background:rgba(247,242,234,.07);color:var(--cream);}
.nav-item.active{background:var(--gold);color:var(--ink);font-weight:600;}
.sidebar-foot{padding:10px;font-size:11px;color:rgba(247,242,234,.35);border-top:1px solid rgba(247,242,234,.1);margin-top:10px;padding-top:14px;}

main{flex:1;padding:30px 36px 60px;max-width:1180px;}
.view{display:none;}
.view.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:27px;margin:0 0 4px;font-weight:700;}
.page-head p{margin:0;color:var(--muted);font-size:13.5px;}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;}

/* ---------- shared components ---------- */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}

.btn{
  border:none;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:transform .1s,box-shadow .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--cream);}
.btn-primary:hover{box-shadow:0 6px 16px -4px rgba(23,19,27,.4);}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{box-shadow:0 6px 16px -4px rgba(198,154,62,.55);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 13px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px;justify-content:center;background:var(--cream);border:1px solid var(--border);color:var(--text);}
.btn-icon:hover{background:#fff;border-color:var(--ink);}

.stat{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px;}
.stat .value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.stat.accent{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.stat.accent .label{color:var(--gold-soft);}
.stat.accent .sub{color:rgba(247,242,234,.55);}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.tag-hombre{background:rgba(44,76,92,.12);color:var(--teal);}
.tag-mujer{background:rgba(181,103,125,.14);color:var(--rose);}
.tag-unisex{background:rgba(198,154,62,.16);color:#93711f;}
.tag-low{background:rgba(179,69,63,.13);color:var(--danger);}
.tag-out{background:var(--danger);color:#fff;}
.tag-ok{background:rgba(63,122,81,.13);color:var(--success);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty i{font-size:34px;color:var(--gold-soft);margin-bottom:10px;display:block;}
.empty h3{margin:6px 0 4px;color:var(--text);font-family:'Fraunces',serif;}

/* bottle gauge — signature element */
.bottle-gauge{position:relative;width:34px;height:52px;flex-shrink:0;}
.bottle-gauge svg{width:100%;height:100%;display:block;}
.gauge-liquid{transition:height .4s ease;}

.perfume-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s;}
.perfume-card:hover{box-shadow:var(--shadow);}
.perfume-top{display:flex;gap:12px;align-items:flex-start;}
.perfume-name{font-weight:700;font-size:14.5px;line-height:1.25;}
.perfume-brand{font-size:12px;color:var(--muted);}
.perfume-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:2px;}
.perfume-ml{font-family:'DM Mono',monospace;font-weight:500;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1.5px solid var(--border);font-weight:700;}
td{padding:11px 12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.table-wrap{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.pay-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.pay-efectivo{background:rgba(63,122,81,.13);color:var(--success);}
.pay-transferencia{background:rgba(44,76,92,.13);color:var(--teal);}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text);}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;background:#fff;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-chip{border:1.5px solid var(--border);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;background:#fff;color:var(--text);}
.radio-chip.selected{background:var(--ink);color:var(--cream);border-color:var(--ink);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(23,19,27,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--paper);border-radius:18px;padding:26px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
.modal.wide{max-width:640px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{margin:0;font-size:19px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:50%;}
.modal-close:hover{background:var(--cream);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;animation:toastIn .2s ease;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.banner{display:flex;align-items:center;gap:12px;background:rgba(198,154,62,.12);border:1px solid rgba(198,154,62,.4);color:#7a5b17;border-radius:12px;padding:13px 16px;margin-bottom:20px;font-size:13.5px;}
.banner.danger{background:rgba(179,69,63,.09);border-color:rgba(179,69,63,.35);color:var(--danger);}
.banner i{font-size:19px;}
.banner strong{font-weight:700;}

.color-swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);cursor:pointer;padding:0;}
.color-swatch.active{box-shadow:0 0 0 2px var(--ink);}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}

.bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--gold-soft),var(--gold));border-radius:6px 6px 3px 3px;min-height:3px;transition:height .4s ease;}
.bar-label{font-size:10.5px;color:var(--muted);}
.bar-value{font-size:10.5px;font-weight:700;font-family:'DM Mono',monospace;}

.qty-price{font-family:'Fraunces',serif;font-weight:600;}
.divider{height:1px;background:var(--border);margin:18px 0;}
.muted{color:var(--muted);}
.right{text-align:right;}
.center{text-align:center;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.logo-upload{display:flex;align-items:center;gap:14px;}
.logo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--cream);border:1.5px solid var(--border);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div id="brandLogoWrap"></div>
      <div class="brand-text">
        <div class="brand-name" id="sideBrandName">Mi Perfumería</div>
        <div class="brand-sub">Decants</div>
      </div>
    </div>
    <nav id="navList">
      <button class="nav-item" data-view="dashboard"><i class="ti ti-sparkles"></i><span>Inicio</span></button>
      <button class="nav-item" data-view="venta"><i class="ti ti-shopping-cart"></i><span>Vender</span></button>
      <button class="nav-item" data-view="inventario"><i class="ti ti-flask"></i><span>Inventario</span></button>
      <button class="nav-item" data-view="catalogo"><i class="ti ti-list-details"></i><span>Catálogo</span></button>
      <button class="nav-item" data-view="pedidos"><i class="ti ti-clipboard-list"></i><span>Pedidos</span></button>
      <button class="nav-item" data-view="costos"><i class="ti ti-receipt-2"></i><span>Costos</span></button>
      <button class="nav-item" data-view="caja"><i class="ti ti-cash-banknote"></i><span>Caja</span></button>
      <button class="nav-item" data-view="reportes"><i class="ti ti-chart-bar"></i><span>Reportes</span></button>
      <button class="nav-item" data-view="config"><i class="ti ti-settings"></i><span>Configuración</span></button>
    </nav>
    <div class="sidebar-foot" id="syncBadge"><i class="ti ti-cloud-off"></i> Sin conexión a la nube</div>
  </aside>

  <main id="main">
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-venta"></div>
    <div class="view" id="view-inventario"></div>
    <div class="view" id="view-catalogo"></div>
    <div class="view" id="view-pedidos"></div>
    <div class="view" id="view-costos"></div>
    <div class="view" id="view-caja"></div>
    <div class="view" id="view-reportes"></div>
    <div class="view" id="view-config"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================================================
   ESTADO Y PERSISTENCIA
============================================================ */
const STORAGE_KEY = 'decants_app_v1';

const defaultState = {
  config: {
    nombreNegocio: 'Mi Perfumería',
    logo: '',
    colorAcento: '#c69a3e',
    cloud: { url: '', key: '', workspaceId: 'default', enabled: false, lastSync: null }
  },
  perfumes: [],
  ventas: [],
  turnos: [],
  pedidos: [],
  costos: []
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const base = structuredClone(defaultState);
    if(!raw) return base;
    const parsed = JSON.parse(raw);
    const merged = Object.assign(base, parsed);
    merged.config = Object.assign(structuredClone(defaultState.config), parsed.config || {});
    merged.config.cloud = Object.assign(structuredClone(defaultState.config.cloud), (parsed.config && parsed.config.cloud) || {});
    return merged;
  }catch(e){
    console.error('Error leyendo almacenamiento', e);
    return structuredClone(defaultState);
  }
}

let state = loadState();

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  scheduleCloudPush();
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ============================================================
   SINCRONIZACIÓN EN LA NUBE (Supabase — llamadas REST directas)
============================================================ */
const SB_TABLE = 'app_state';
let syncPushTimer = null;
let syncPollTimer = null;

function cloudConfigured(){
  const c = state.config.cloud;
  return !!(c && c.enabled && c.url && c.key);
}
function sbHeaders(){
  return {
    'apikey': state.config.cloud.key,
    'Authorization': 'Bearer ' + state.config.cloud.key,
    'Content-Type': 'application/json'
  };
}
function sbBaseUrl(){
  return state.config.cloud.url.replace(/\/$/, '');
}
async function sbPull(){
  const id = state.config.cloud.workspaceId || 'default';
  const res = await fetch(`${sbBaseUrl()}/rest/v1/${SB_TABLE}?id=eq.${encodeURIComponent(id)}&select=data,updated_at`, { headers: sbHeaders() });
  if(!res.ok) throw new Error('No se pudo leer de Supabase (' + res.status + ')');
  const rows = await res.json();
  return rows[0] || null;
}
async function sbPush(){
  const id = state.config.cloud.workspaceId || 'default';
  const payload = {
    id,
    data: { perfumes: state.perfumes, ventas: state.ventas, turnos: state.turnos, pedidos: state.pedidos, costos: state.costos,
      config: { nombreNegocio: state.config.nombreNegocio, logo: state.config.logo, colorAcento: state.config.colorAcento } },
    updated_at: new Date().toISOString()
  };
  const res = await fetch(`${sbBaseUrl()}/rest/v1/${SB_TABLE}`, {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
    body: JSON.stringify([payload])
  });
  if(!res.ok) throw new Error('No se pudo sincronizar (' + res.status + ')');
  const rows = await res.json();
  return rows[0];
}
function applyRemoteData(data){
  state.perfumes = data.perfumes || [];
  state.ventas = data.ventas || [];
  state.turnos = data.turnos || [];
  state.pedidos = data.pedidos || [];
  state.costos = data.costos || [];
  if(data.config){
    state.config.nombreNegocio = data.config.nombreNegocio || state.config.nombreNegocio;
    state.config.logo = data.config.logo || state.config.logo;
    state.config.colorAcento = data.config.colorAcento || state.config.colorAcento;
  }
}
function scheduleCloudPush(){
  if(!cloudConfigured()) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(async ()=>{
    try{
      const row = await sbPush();
      state.config.cloud.lastSync = row ? row.updated_at : new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateSyncBadge();
    }catch(err){
      console.error(err);
      toast('No se pudo sincronizar con la nube', 'err');
    }
  }, 900);
}
function startCloudPolling(){
  stopCloudPolling();
  if(!cloudConfigured()) return;
  syncPollTimer = setInterval(async ()=>{
    try{
      const remote = await sbPull();
      if(!remote) return;
      const remoteTime = new Date(remote.updated_at).getTime();
      const lastKnown = state.config.cloud.lastSync ? new Date(state.config.cloud.lastSync).getTime() : 0;
      if(remoteTime > lastKnown + 1500){
        applyRemoteData(remote.data);
        state.config.cloud.lastSync = remote.updated_at;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(currentView) renderers[currentView]();
        updateSyncBadge();
      }
    }catch(err){ console.error(err); }
  }, 20000);
}
function stopCloudPolling(){
  if(syncPollTimer) clearInterval(syncPollTimer);
  syncPollTimer = null;
}
function updateSyncBadge(){
  const badge = document.getElementById('syncBadge');
  if(!badge) return;
  if(cloudConfigured()){
    const t = state.config.cloud.lastSync ? fmtTime(state.config.cloud.lastSync) : '—';
    badge.innerHTML = `<i class="ti ti-cloud-check" style="color:var(--success);"></i> Sincronizado · ${t}`;
  }else{
    badge.innerHTML = `<i class="ti ti-cloud-off"></i> Sin conexión a la nube`;
  }
}
async function conectarNube(url, key){
  state.config.cloud.url = url;
  state.config.cloud.key = key;
  state.config.cloud.enabled = true;
  try{
    const remote = await sbPull();
    const remoteHasData = remote && remote.data && ((remote.data.perfumes||[]).length || (remote.data.ventas||[]).length || (remote.data.turnos||[]).length);
    if(remoteHasData){
      const usarNube = confirm('Ya hay datos guardados en la nube.\n\nAceptar = usar los datos de la nube en este dispositivo (reemplaza lo local).\nCancelar = subir tus datos locales y sobrescribir la nube.');
      if(usarNube){ applyRemoteData(remote.data); }
      else { await sbPush(); }
    }else{
      await sbPush();
    }
    state.config.cloud.lastSync = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    startCloudPolling();
    toast('Conectado a la nube', 'ok');
    return true;
  }catch(err){
    state.config.cloud.enabled = false;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    toast(err.message || 'No se pudo conectar', 'err');
    return false;
  }
}
function desconectarNube(){
  state.config.cloud.enabled = false;
  stopCloudPolling();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateSyncBadge();
  toast('Sincronización desactivada', 'ok');
}

/* ============================================================
   UTILIDADES
============================================================ */
function money(n){
  n = Number(n) || 0;
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function ml(n){
  n = Number(n) || 0;
  return n.toLocaleString('es-MX', {maximumFractionDigits:1}) + ' ml';
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es-MX', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.innerHTML = `<i class="ti ti-${type==='err'?'alert-triangle':type==='ok'?'check':'info-circle'}"></i>${msg}`;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(()=>{el.remove();}, 3200);
}
function categoryTag(cat){
  const map = {hombre:['tag-hombre','Hombre'], mujer:['tag-mujer','Mujer'], unisex:['tag-unisex','Unisex']};
  const [cls,label] = map[cat] || map.unisex;
  return `<span class="tag ${cls}">${label}</span>`;
}
function stockTag(p){
  const restante = p.mlRestantes;
  if(restante <= 0) return '<span class="tag tag-out">Agotado</span>';
  if(restante <= p.mlMinimo) return '<span class="tag tag-low"><i class="ti ti-alert-triangle" style="font-size:11px;"></i> Stock bajo</span>';
  return '<span class="tag tag-ok">En stock</span>';
}
function photoThumb(p, size){
  size = size || 40;
  const r = Math.round(size*0.28);
  if(p.foto){
    return `<img src="${p.foto}" style="width:${size}px;height:${size}px;border-radius:${r}px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);">`;
  }
  return `<div style="width:${size}px;height:${size}px;border-radius:${r}px;background:var(--cream);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);">
    <i class="ti ti-camera" style="font-size:${Math.round(size*0.42)}px;"></i>
  </div>`;
}
function bottleGauge(p, size){
  size = size || 34;
  const h = Math.round(size * 1.55);
  const pct = Math.max(0, Math.min(1, p.mlRestantes / (p.mlTotal || 1)));
  const liquidH = Math.round((h - 10) * pct);
  const color = p.mlRestantes <= p.mlMinimo ? 'var(--danger)' :
    (p.categoria === 'hombre' ? 'var(--teal)' : p.categoria === 'mujer' ? 'var(--rose)' : 'var(--gold)');
  return `
  <div class="bottle-gauge" style="width:${size}px;height:${h}px;">
    <svg viewBox="0 0 34 ${h}" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="1" width="10" height="7" rx="1.5" fill="#cfc7b8"/>
      <rect x="4" y="8" width="26" height="${h-10}" rx="6" fill="#fff" stroke="#d8d0c0" stroke-width="1.5"/>
      <clipPath id="clip-${p.id}-${size}"><rect x="5.5" y="9.5" width="23" height="${h-13}" rx="5"/></clipPath>
      <g clip-path="url(#clip-${p.id}-${size})">
        <rect class="gauge-liquid" x="5.5" y="${h - 3.5 - liquidH}" width="23" height="${liquidH}" fill="${color}" opacity="0.85"/>
      </g>
    </svg>
  </div>`;
}

function applyTheme(){
  document.documentElement.style.setProperty('--gold', state.config.colorAcento);
  document.getElementById('sideBrandName').textContent = state.config.nombreNegocio;
  document.title = state.config.nombreNegocio + ' · Gestión de Decants';
  const wrap = document.getElementById('brandLogoWrap');
  if(state.config.logo){
    wrap.innerHTML = `<img class="brand-logo" src="${state.config.logo}" alt="logo">`;
  }else{
    wrap.innerHTML = `<div class="brand-logo-fallback"><i class="ti ti-flask"></i></div>`;
  }
}

let currentView = 'dashboard';
const renderers = {
  dashboard: renderDashboard,
  venta: renderVenta,
  inventario: renderInventario,
  catalogo: renderCatalogo,
  pedidos: renderPedidos,
  costos: renderCostos,
  caja: renderCaja,
  reportes: renderReportes,
  config: renderConfig
};

function goTo(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  renderers[view]();
  window.scrollTo(0,0);
}

document.getElementById('navList').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-item');
  if(btn) goTo(btn.dataset.view);
});

/* ============================================================
   TURNO / CAJA — helpers
============================================================ */
function turnoAbierto(){
  return state.turnos.find(t => t.estado === 'abierto') || null;
}
function ventasDeTurno(turnoId){
  return state.ventas.filter(v => v.turnoId === turnoId);
}
function ventasDeHoy(){
  const hoy = todayStr();
  return state.ventas.filter(v => v.fecha === hoy);
}

   DASHBOARD
============================================================ */

  const turno = turnoAbierto();
  const ventasHoy = ventasDeHoy();
  const totalHoy = ventasHoy.reduce((s,v)=>s+v.total,0);

  const transferenciaHoy = ventasHoy.filter(v=>v.metodoPago==='transferencia').reduce((s,v)=>s+v.total,0);
  const bajos = state.perfumes.filter(p=>p.mlRestantes<=p.mlMinimo && p.mlRestantes>0);
  const agotados = state.perfumes.filter(p=>p.mlRestantes<=0);

  let alertas = '';
  if(agotados.length){
    alertas += `<div class="banner danger"><i class="ti ti-flask-off"></i><div><strong>${agotados.length} perfume(s) agotado(s):</strong> ${agotados.map(p=>p.nombre).join(', ')}. Repón con tu proveedor.</div></div>`;
  }
  if(bajos.length){
    alertas += `<div class="banner"><i class="ti ti-alert-triangle"></i><div><strong>${bajos.length} perfume(s) con stock bajo:</strong> ${bajos.map(p=>p.nombre+' ('+ml(p.mlRestantes)+')').join(', ')}. Considera pedir más.</div></div>`;
  }

  el.innerHTML = `
    <div class="page-head">
      <div>

        <h1>Buen día${state.config.nombreNegocio ? ', ' + state.config.nombreNegocio : ''}</h1>
        <p>Aquí tienes el resumen de tu operación de hoy.</p>
      </div>

        <button class="btn btn-gold" id="btnGoVenta"><i class="ti ti-plus"></i> Nueva venta</button>
      </div>
    </div>

    ${alertas}

    <div class="grid grid-4" style="margin-bottom:26px;">
      <div class="stat accent">
        <div class="label">Estado de caja</div>
        <div class="value" style="font-size:19px;">${turno ? 'Turno abierto' : 'Cerrado'}</div>
        <div class="sub">${turno ? 'Desde las ' + fmtTime(turno.horaApertura) : 'Abre un turno para vender'}</div>
      </div>
      <div class="stat">
        <div class="label">Ventas de hoy</div>
        <div class="value">${money(totalHoy)}</div>
        <div class="sub">${ventasHoy.length} venta(s)</div>
      </div>
      <div class="stat">
        <div class="label">Efectivo</div>
        <div class="value">${money(efectivoHoy)}</div>
        <div class="sub">en ventas de hoy</div>
      </div>
      <div class="stat">
        <div class="label">Transferencia</div>
        <div class="value">${money(transferenciaHoy)}</div>
        <div class="sub">en ventas de hoy</div>
      </div>
    </div>

    <div class="flex-between" style="margin-bottom:12px;">
      <h3 style="margin:0;">Tu inventario</h3>
      <span class="muted" style="font-size:12.5px;">${state.perfumes.length} perfume(s) en catálogo</span>
    </div>
    ${state.perfumes.length ? `<div class="grid grid-4">${state.perfumes.slice().sort((a,b)=> (a.mlRestantes/a.mlTotal) - (b.mlRestantes/b.mlTotal)).slice(0,8).map(p=>miniPerfumeCard(p)).join('')}</div>` :
    `<div class="empty card"><i class="ti ti-flask"></i><h3>Aún no tienes perfumes</h3><p>Agrega tu primera botella al catálogo para empezar.</p><button class="btn btn-gold" style="margin-top:10px;" id="btnEmptyAdd"><i class="ti ti-plus"></i> Agregar perfume</button></div>`}

function miniPerfumeCard(p){
  return `
  <div class="perfume-card">
    <div class="perfume-top">
      ${photoThumb(p,34)}
      ${bottleGauge(p,26)}
      <div style="flex:1;min-width:0;">
        <div class="perfume-name">${p.nombre}</div>
        <div class="perfume-brand">${p.marca||''}</div>
        <div style="margin-top:6px;">${categoryTag(p.categoria)}</div>
      </div>
    </div>
    <div class="perfume-meta">
      <span class="perfume-ml">${ml(p.mlRestantes)} / ${ml(p.mlTotal)}</span>
      ${stockTag(p)}
    </div>
  </div>`;
}

/* ============================================================
   VENTA (PUNTO DE VENTA)
============================================================ */
let ventaState = { perfumeId: null, tipo: '5ml', mlCustom: 5, precioCustom: undefined, metodoPago: 'efectivo', recibido: '' };
let ventaCart = [];

function mlReservadoEnCarrito(perfumeId){
  return ventaCart.filter(it=>it.perfumeId===perfumeId).reduce((s,it)=>s+it.ml,0);
}
function disponible(p){
  return Math.max(0, +(p.mlRestantes - mlReservadoEnCarrito(p.id)).toFixed(2));
}

function renderVenta(){
  const el = document.getElementById('view-venta');
  const turno = turnoAbierto();

  if(!turno){
    el.innerHTML = `
      <div class="page-head"><div><div class="eyebrow">Vender</div><h1>Punto de venta</h1></div></div>
      <div class="empty card">
        <i class="ti ti-lock"></i>
        <h3>Abre tu turno para empezar a vender</h3>
        <p>Registra el efectivo con el que inicias el día antes de hacer ventas.</p>
        <button class="btn btn-gold" style="margin-top:10px;" id="btnAbrirDesdeVenta"><i class="ti ti-cash-banknote"></i> Abrir turno</button>
      </div>`;
    document.getElementById('btnAbrirDesdeVenta').onclick = ()=>goTo('caja');
    return;
  }

  if(!state.perfumes.length){
    el.innerHTML = `
      <div class="page-head"><div><div class="eyebrow">Vender</div><h1>Punto de venta</h1></div></div>
      <div class="empty card"><i class="ti ti-flask"></i><h3>Agrega perfumes a tu catálogo primero</h3>
      <button class="btn btn-gold" style="margin-top:10px;" id="btnIrCatalogo"><i class="ti ti-plus"></i> Ir al catálogo</button></div>`;
    document.getElementById('btnIrCatalogo').onclick = ()=>goTo('catalogo');
    return;
  }

  if(!ventaState.perfumeId || !state.perfumes.find(p=>p.id===ventaState.perfumeId)){
    ventaState.perfumeId = state.perfumes.find(p=>disponible(p)>0)?.id || state.perfumes[0].id;
  }
  const p = state.perfumes.find(x=>x.id===ventaState.perfumeId);
  const disp = disponible(p);

  el.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Turno abierto · ${fmtTime(turno.horaApertura)}</div><h1>Punto de venta</h1></div>
    </div>
    <div class="grid grid-2" style="align-items:start;grid-template-columns:1.15fr .85fr;">
      <div>
        <div class="section-title">1. Elige el perfume</div>
        <div class="grid grid-3" id="ventaPerfumeGrid" style="grid-template-columns:repeat(3,1fr);">
          ${state.perfumes.map(pf=>{
            const dpf = disponible(pf);
            return `
            <button class="perfume-card" data-pid="${pf.id}" style="text-align:left;border:1.5px solid ${pf.id===p.id?'var(--gold)':'var(--border)'};${dpf<=0?'opacity:.45;':''}" ${dpf<=0?'disabled':''}>
              <div class="perfume-top">
                ${photoThumb(pf,30)}
                ${bottleGauge(pf,24)}
                <div style="flex:1;min-width:0;">
                  <div class="perfume-name">${pf.nombre}</div>
                  <div class="perfume-brand">${pf.marca||''}</div>
                </div>
              </div>
              <div class="perfume-meta"><span class="perfume-ml">${ml(dpf)} disp.</span>${categoryTag(pf.categoria)}</div>
            </button>`;}).join('')}
        </div>

        <div class="section-title">2. Tipo de venta</div>
        <div class="card">
          <div class="radio-row" id="tipoVentaRow">
            <button class="radio-chip ${ventaState.tipo==='5ml'?'selected':''}" data-tipo="5ml" ${disp<5?'disabled':''}>5 ml — ${money(p.precio5ml)}</button>
            <button class="radio-chip ${ventaState.tipo==='10ml'?'selected':''}" data-tipo="10ml" ${disp<10?'disabled':''}>10 ml — ${money(p.precio10ml)}</button>
            <button class="radio-chip ${ventaState.tipo==='completa'?'selected':''}" data-tipo="completa" ${disp<=0?'disabled':''}>Botella completa — ${money(p.precioBotella)}</button>
            <button class="radio-chip ${ventaState.tipo==='custom'?'selected':''}" data-tipo="custom" ${disp<=0?'disabled':''}>Cantidad personalizada</button>
          </div>
          ${ventaState.tipo==='custom' ? `
          <div class="field-row" style="margin-top:14px;">
            <div class="field" style="margin-bottom:0;">
              <label>Mililitros</label>
              <input type="number" id="mlCustomInput" min="1" max="${disp}" value="${ventaState.mlCustom}">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label>Precio total</label>
              <input type="number" id="precioCustomInput" min="0" step="0.5" value="${(ventaState.precioCustom !== undefined ? ventaState.precioCustom : precioPorMl(p) * ventaState.mlCustom).toFixed(2)}">
            </div>
          </div>` : ''}
          <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:14px;" id="btnAgregarCarrito"><i class="ti ti-shopping-cart-plus"></i> Agregar al carrito</button>
        </div>

        <div class="section-title">3. Método de pago</div>
        <div class="card">
          <div class="radio-row">
            <button class="radio-chip ${ventaState.metodoPago==='efectivo'?'selected':''}" data-pago="efectivo"><i class="ti ti-cash"></i> Efectivo</button>
            <button class="radio-chip ${ventaState.metodoPago==='transferencia'?'selected':''}" data-pago="transferencia"><i class="ti ti-building-bank"></i> Transferencia</button>
          </div>
          ${ventaState.metodoPago==='efectivo' ? `
          <div class="field" style="margin-top:14px;max-width:220px;">
            <label>Monto recibido</label>
            <input type="number" id="recibidoInput" min="0" step="1" placeholder="0.00" value="${ventaState.recibido}">
          </div>` : ''}
        </div>
      </div>

      <div>
        <div class="section-title">Carrito · ${ventaCart.length} producto(s)</div>
        <div class="card" id="resumenVenta"></div>
      </div>
    </div>
  `;

  el.querySelectorAll('#ventaPerfumeGrid [data-pid]').forEach(btn=>{
    btn.onclick = ()=>{ ventaState.perfumeId = btn.dataset.pid; ventaState.tipo='5ml'; ventaState.precioCustom=undefined; renderVenta(); };
  });
  el.querySelectorAll('#tipoVentaRow [data-tipo]').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=>{ ventaState.tipo = btn.dataset.tipo; ventaState.precioCustom=undefined; if(btn.dataset.tipo==='custom'){ ventaState.mlCustom = Math.min(5, disponible(p)); } renderVenta(); };
  });
  el.querySelectorAll('[data-pago]').forEach(btn=>{
    btn.onclick = ()=>{ ventaState.metodoPago = btn.dataset.pago; renderVenta(); };
  });
  const mlCustomInput = document.getElementById('mlCustomInput');
  if(mlCustomInput) mlCustomInput.oninput = (e)=>{ ventaState.mlCustom = Number(e.target.value)||0; ventaState.precioCustom = undefined; renderResumen(); };
  const precioCustomInput = document.getElementById('precioCustomInput');
  if(precioCustomInput) precioCustomInput.oninput = (e)=>{ ventaState.precioCustom = Number(e.target.value)||0; renderResumen(); };
  const recibidoInput = document.getElementById('recibidoInput');
  if(recibidoInput) recibidoInput.oninput = (e)=>{ ventaState.recibido = e.target.value; renderResumen(); };
  document.getElementById('btnAgregarCarrito').onclick = agregarAlCarrito;

  renderResumen();
}

function precioPorMl(p){
  if(p.precio10ml) return p.precio10ml/10;
  if(p.precio5ml) return p.precio5ml/5;
  return 0;
}

function itemActualParaAgregar(){
  const p = state.perfumes.find(x=>x.id===ventaState.perfumeId);
  if(!p) return null;
  const disp = disponible(p);
  let mlVendidos, total, tipoLabel;
  if(ventaState.tipo==='5ml'){ mlVendidos=5; total=p.precio5ml; tipoLabel='Decant 5 ml'; }
  else if(ventaState.tipo==='10ml'){ mlVendidos=10; total=p.precio10ml; tipoLabel='Decant 10 ml'; }
  else if(ventaState.tipo==='completa'){ mlVendidos=disp; total=p.precioBotella; tipoLabel='Botella completa'; }
  else { mlVendidos=ventaState.mlCustom; total = ventaState.precioCustom !== undefined ? ventaState.precioCustom : precioPorMl(p)*ventaState.mlCustom; tipoLabel=`Personalizado (${mlVendidos} ml)`; }
  const stockValido = mlVendidos > 0 && mlVendidos <= disp;
  return {p, mlVendidos, total, tipoLabel, stockValido};
}

function agregarAlCarrito(){
  const it = itemActualParaAgregar();
  if(!it){ return; }
  if(!it.stockValido){ toast('No hay suficiente stock disponible para agregar eso', 'err'); return; }
  if(it.total<=0){ toast('El precio debe ser mayor a cero', 'err'); return; }
  ventaCart.push({
    itemId: uid('item'),
    perfumeId: it.p.id,
    perfumeNombre: it.p.nombre,
    tipo: it.tipoLabel,
    ml: it.mlVendidos,
    total: it.total
  });
  toast(`${it.p.nombre} agregado al carrito`, 'ok');
  ventaState.tipo = '5ml';
  ventaState.precioCustom = undefined;
  renderVenta();
}

function quitarDelCarrito(itemId){
  ventaCart = ventaCart.filter(it=>it.itemId!==itemId);
  renderVenta();
}

function calcularCarrito(){
  const total = ventaCart.reduce((s,it)=>s+it.total,0);
  const recibido = Number(ventaState.recibido)||0;
  const cambio = ventaState.metodoPago==='efectivo' ? Math.max(0, recibido - total) : 0;
  const alcanza = ventaState.metodoPago==='efectivo' ? recibido >= total : true;
  return {total, recibido, cambio, alcanza};
}

function renderResumen(){
  const box = document.getElementById('resumenVenta');
  if(!box) return;

  if(!ventaCart.length){
    box.innerHTML = `<div class="empty" style="padding:26px 10px;"><i class="ti ti-shopping-cart" style="font-size:28px;color:var(--gold-soft);"></i><p class="muted" style="margin-top:8px;font-size:13px;">Agrega uno o varios perfumes al carrito para cobrar todo junto.</p></div>`;
    return;
  }

  const {total, recibido, cambio, alcanza} = calcularCarrito();

  let warn = '';
  if(ventaState.metodoPago==='efectivo' && !alcanza && recibido>0) warn = `<div class="banner danger" style="margin:0 0 14px;"><i class="ti ti-alert-triangle"></i> El monto recibido no cubre el total.</div>`;

  box.innerHTML = `
    ${warn}
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
      ${ventaCart.map(it=>`
        <div class="flex-between" style="gap:8px;">
          <div style="min-width:0;">
            <div style="font-weight:700;font-size:13.5px;">${it.perfumeNombre}</div>
            <div class="muted" style="font-size:11.5px;">${it.tipo} · ${ml(it.ml)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span class="num" style="font-weight:700;">${money(it.total)}</span>
            <button class="btn-icon" data-quitar="${it.itemId}" style="width:26px;height:26px;" title="Quitar"><i class="ti ti-x" style="font-size:13px;"></i></button>
          </div>
        </div>`).join('')}
    </div>
    <div class="divider"></div>
    <div class="flex-between" style="margin-bottom:8px;"><span class="muted">Total a cobrar</span><span class="qty-price" style="font-size:22px;">${money(total)}</span></div>
    ${ventaState.metodoPago==='efectivo' ? `
    <div class="divider"></div>
    <div class="flex-between" style="margin-bottom:8px;"><span class="muted">Recibido</span><span class="num">${money(recibido)}</span></div>
    <div class="flex-between"><span class="muted">Cambio</span><span class="num" style="font-weight:700;color:var(--success);">${money(cambio)}</span></div>
    ` : `<div class="banner" style="margin-top:10px;"><i class="ti ti-building-bank"></i> Se registrará como transferencia.</div>`}
    <button class="btn btn-gold" style="width:100%;justify-content:center;margin-top:18px;" id="btnConfirmarVenta" ${((ventaState.metodoPago==='efectivo' && !alcanza) || total<=0)?'disabled':''}>
      <i class="ti ti-check"></i> Cobrar carrito
    </button>
  `;
  box.querySelectorAll('[data-quitar]').forEach(btn=>{
    btn.onclick = ()=>quitarDelCarrito(btn.dataset.quitar);
  });
  const btn = document.getElementById('btnConfirmarVenta');
  if(btn) btn.onclick = confirmarVenta;
}

function confirmarVenta(){
  if(!ventaCart.length) return;
  const turno = turnoAbierto();
  if(!turno){ toast('No hay un turno abierto.', 'err'); return; }
  const {total, recibido, cambio} = calcularCarrito();

  // valida stock una última vez por perfume (suma de todo lo reservado en el carrito)
  const totalesPorPerfume = {};
  ventaCart.forEach(it=>{ totalesPorPerfume[it.perfumeId] = (totalesPorPerfume[it.perfumeId]||0) + it.ml; });
  for(const pid in totalesPorPerfume){
    const p = state.perfumes.find(x=>x.id===pid);
    if(!p || totalesPorPerfume[pid] > p.mlRestantes){
      toast('El stock cambió mientras armabas el carrito. Revisa las cantidades.', 'err');
      renderVenta();
      return;
    }
  }

  const grupoId = uid('grupo');
  ventaCart.forEach(it=>{
    const p = state.perfumes.find(x=>x.id===it.perfumeId);
    p.mlRestantes = Math.max(0, +(p.mlRestantes - it.ml).toFixed(2));
    state.ventas.push({
      id: uid('venta'),
      fecha: todayStr(),
      hora: new Date().toISOString(),
      turnoId: turno.id,
      ventaGrupoId: grupoId,
      perfumeId: it.perfumeId,
      perfumeNombre: it.perfumeNombre,

      ml: it.ml,
      total: it.total,
      metodoPago: ventaState.metodoPago,
      recibido: ventaState.metodoPago==='efectivo' ? recibido : total,
      cambio: cambio
    });
  });

  saveState();
  toast(`Venta registrada: ${ventaCart.length} producto(s) · ${money(total)}`, 'ok');

  ventaState.tipo = '5ml';

}

/* ============================================================
   COSTOS OPERATIVOS Y MARGEN REAL
============================================================ */
function totalCostosPorTipo(tipo){
  return state.costos.filter(c=>c.tipo===tipo).reduce((s,c)=>s+c.monto,0);
}
function mesActualStr(){
  return todayStr().slice(0,7);
}
function mlVendidosDelMes(mes){
  mes = mes || mesActualStr();
  return state.ventas.filter(v=>v.fecha.slice(0,7)===mes).reduce((s,v)=>s+v.ml,0);
}
// Reparte los costos fijos mensuales entre lo vendido este mes (ml), y suma
// los costos variables por venta (empaque, etiquetas, etc.) a cada transacción.
function costoOperativoPorMl(){
  const ml = mlVendidosDelMes();
  const fijos = totalCostosPorTipo('fijo');
  return ml > 0 ? fijos / ml : 0;
}
function costoVariablePorVenta(){
  return totalCostosPorTipo('variable');
}

/* ============================================================
   INVENTARIO
============================================================ */
function gananciaDePerfume(p){
  const ventasP = state.ventas.filter(v=>v.perfumeId===p.id);
  const costoDirectoPorMl = p.mlTotal ? (p.costoBotella / p.mlTotal) : 0;
  const opPorMl = costoOperativoPorMl();
  const varPorVenta = costoVariablePorVenta();
  let ingresos = 0, costoDirecto = 0, costoOperativo = 0;
  ventasP.forEach(v=>{
    ingresos += v.total;
    costoDirecto += costoDirectoPorMl * v.ml;
    costoOperativo += (opPorMl * v.ml) + varPorVenta;
  });
  const gananciaBruta = ingresos - costoDirecto;
  const gananciaNeta = ingresos - costoDirecto - costoOperativo;
  const margenBruto = ingresos > 0 ? (gananciaBruta / ingresos * 100) : 0;
  const margenNeto = ingresos > 0 ? (gananciaNeta / ingresos * 100) : 0;
  return {ingresos, costoDirecto, costoOperativo, gananciaBruta, gananciaNeta, margenBruto, margenNeto, numVentas: ventasP.length};
}

  return {ganancia, porcentaje};
}

    const p = state.pedidos.find(x=>x.id===b.dataset.delp);

      state.pedidos = state.pedidos.filter(x=>x.id!==p.id);

  el.querySelectorAll('[data-entregar]').forEach(b=>b.onclick=()=>{

  const el = document.getElementById('view-costos');

      <div class="stat"><div class="label">Variables por venta</div><div class="value">${money(totalVariable)}</div><div class="sub">se suman a cada decant vendido</div></div>

        <div><div style="font-size:11.5px;color:rgba(247,242,234,.6);margin-bottom:4px;">Costo directo + operativo</div><div class="qty-price" style="font-size:22px;">${money(costoDirecto+costoOperativo)}</div></div>
        <div><div style="font-size:11.5px;color:var(--gold-soft);margin-bottom:4px;">Ganancia neta real</div><div class="qty-price" style="font-size:22px;color:${gananciaNetaTotal<0?'#e08b85':'var(--gold-soft)'};">${money(gananciaNetaTotal)} · ${margenNetoTotal.toFixed(1)}%</div></div>
      </div>
      <div class="hint" style="color:rgba(247,242,234,.5);margin-top:10px;">Con base en ${ml(mlMes)} vendidos este mes para repartir tus costos fijos.</div>
    </div>

    ${costos.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Concepto</th><th>Categoría</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th></th></tr></thead>
        <tbody>
        ${costos.map(c=>`<tr>
          <td style="font-weight:700;">${c.concepto}</td>
          <td>${c.categoria}</td>
          <td><span class="tag ${c.tipo==='fijo'?'tag-unisex':c.tipo==='variable'?'tag-hombre':'tag-mujer'}">${c.tipo==='fijo'?'Fijo mensual':c.tipo==='variable'?'Variable por venta':'Pago único'}</span></td>

              <button class="btn-icon" data-editc="${c.id}" title="Editar"><i class="ti ti-pencil"></i></button>
              <button class="btn-icon" data-delc="${c.id}" title="Eliminar"><i class="ti ti-trash"></i></button>
            </div>
          </td>
        </tr>`).join('')}

  `;
  document.getElementById('btnNuevoCosto').onclick = ()=>openCostoModal();

    const c = state.costos.find(x=>x.id===b.dataset.delc);
    if(confirm(`¿Eliminar el costo "${c.concepto}"?`)){
      state.costos = state.costos.filter(x=>x.id!==c.id);

   CAJA (TURNOS)
============================================================ */
function renderCaja(){
  const el = document.getElementById('view-caja');
  const turno = turnoAbierto();

  if(!turno){
    const cerrados = state.turnos.filter(t=>t.estado==='cerrado').slice().reverse().slice(0,5);
    el.innerHTML = `
      <div class="page-head"><div><div class="eyebrow">Caja</div><h1>Control de turno</h1></div></div>
      <div class="empty card">
        <i class="ti ti-cash-banknote"></i>
        <h3>No tienes un turno abierto</h3>
        <p>Registra con cuánto dinero inicias el día antes de vender.</p>
        <div class="field" style="max-width:240px;margin:16px auto 0;text-align:left;">
          <label>Monto inicial en caja</label>
          <input type="number" id="montoInicial" min="0" step="1" placeholder="0.00">
        </div>
        <button class="btn btn-gold" id="btnAbrirTurno" style="margin-top:6px;"><i class="ti ti-lock-open"></i> Abrir turno</button>
      </div>
      ${cerrados.length ? `
      <div class="section-title">Últimos turnos cerrados</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Inicial</th><th>Efectivo</th><th>Transferencia</th><th>Total</th><th>Diferencia</th></tr></thead>
        <tbody>${cerrados.map(t=>`<tr>
          <td>${fmtDate(t.fecha)}</td><td class="num">${money(t.montoInicial)}</td><td class="num">${money(t.ventasEfectivo)}</td>
          <td class="num">${money(t.ventasTransferencia)}</td><td class="num" style="font-weight:700;">${money(t.totalVentas)}</td>
          <td class="num" style="color:${t.diferencia<0?'var(--danger)':t.diferencia>0?'var(--success)':'inherit'}">${t.diferencia>0?'+':''}${money(t.diferencia)}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : ''}
    `;
    document.getElementById('btnAbrirTurno').onclick = ()=>{
      const monto = Number(document.getElementById('montoInicial').value)||0;
      state.turnos.push({
        id: uid('turno'), fecha: todayStr(), horaApertura: new Date().toISOString(),
        montoInicial: monto, estado: 'abierto'
      });
      saveState(); toast('Turno abierto', 'ok'); renderCaja();
    };
    return;
  }

  const ventas = ventasDeTurno(turno.id);
  const efectivo = ventas.filter(v=>v.metodoPago==='efectivo').reduce((s,v)=>s+v.total,0);
  const transferencia = ventas.filter(v=>v.metodoPago==='transferencia').reduce((s,v)=>s+v.total,0);
  const totalVentas = efectivo + transferencia;
  const esperadoCaja = turno.montoInicial + efectivo;

  el.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Turno desde ${fmtTime(turno.horaApertura)}</div><h1>Caja abierta</h1></div></div>
    <div class="grid grid-4" style="margin-bottom:24px;">
      <div class="stat"><div class="label">Efectivo inicial</div><div class="value">${money(turno.montoInicial)}</div></div>
      <div class="stat"><div class="label">Ventas efectivo</div><div class="value">${money(efectivo)}</div><div class="sub">${ventas.filter(v=>v.metodoPago==='efectivo').length} venta(s)</div></div>
      <div class="stat"><div class="label">Ventas transferencia</div><div class="value">${money(transferencia)}</div><div class="sub">${ventas.filter(v=>v.metodoPago==='transferencia').length} venta(s)</div></div>
      <div class="stat accent"><div class="label">Efectivo esperado en caja</div><div class="value">${money(esperadoCaja)}</div></div>
    </div>

    <div class="grid grid-2" style="grid-template-columns:1fr 1fr;align-items:start;">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Hora</th><th>Perfume</th><th>Cant.</th><th>Pago</th><th>Total</th></tr></thead>
          <tbody>
          ${ventas.length ? ventas.slice().reverse().map(v=>`<tr>
            <td>${fmtTime(v.hora)}</td><td>${v.perfumeNombre}<div class="muted" style="font-size:11px;">${v.tipo}</div></td>
            <td class="num">${ml(v.ml)}</td>
            <td><span class="pay-badge pay-${v.metodoPago}">${v.metodoPago==='efectivo'?'Efectivo':'Transferencia'}</span></td>
            <td class="num" style="font-weight:700;">${money(v.total)}</td>
          </tr>`).join('') : `<tr><td colspan="5" class="center muted" style="padding:24px;">Sin ventas todavía en este turno</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Cerrar turno</h3>
        <p class="muted" style="font-size:13px;">Cuenta el efectivo físico en caja e ingrésalo para calcular la diferencia.</p>
        <div class="field"><label>Efectivo contado al cierre</label><input type="number" id="montoFinal" min="0" step="1" placeholder="0.00"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" id="btnCerrarTurno"><i class="ti ti-lock"></i> Cerrar turno</button>
      </div>
    </div>
  `;
  document.getElementById('btnCerrarTurno').onclick = ()=>{
    const montoFinal = document.getElementById('montoFinal').value;
    if(montoFinal===''){ toast('Ingresa el efectivo contado', 'err'); return; }
    const contado = Number(montoFinal);
    const diferencia = +(contado - esperadoCaja).toFixed(2);
    turno.estado = 'cerrado';
    turno.horaCierre = new Date().toISOString();
    turno.montoFinalContado = contado;
    turno.ventasEfectivo = efectivo;
    turno.ventasTransferencia = transferencia;
    turno.totalVentas = totalVentas;
    turno.esperadoCaja = esperadoCaja;
    turno.diferencia = diferencia;
    saveState();
    toast(`Turno cerrado. Diferencia: ${money(diferencia)}`, diferencia===0?'ok':(diferencia<0?'err':'ok'));
    renderCaja();
  };
}

/* ============================================================
   REPORTES
============================================================ */
let reportesFiltro = { desde: '', hasta: '', perfumeId: 'todos' };
function renderReportes(){
  const el = document.getElementById('view-reportes');

  // últimos 7 días
  const dias = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    dias.push(d.toISOString().slice(0,10));
  }
  const totalesPorDia = dias.map(d => state.ventas.filter(v=>v.fecha===d).reduce((s,v)=>s+v.total,0));
  const maxTotal = Math.max(1, ...totalesPorDia);

  const turnosCerrados = state.turnos.filter(t=>t.estado==='cerrado').slice().reverse();
  const totalGeneral = state.ventas.reduce((s,v)=>s+v.total,0);
  const mlTotalVendidos = state.ventas.reduce((s,v)=>s+v.ml,0);

  // más vendidos — con margen neto real por perfume
  const topPerfumes = state.perfumes
    .map(p=>({p, g: gananciaDePerfume(p)}))
    .filter(x=>x.g.numVentas>0)
    .sort((a,b)=>b.g.ingresos-a.g.ingresos)
    .slice(0,6);

  // consulta filtrada por fecha / producto
  const filtradas = state.ventas.filter(v=>{
    if(reportesFiltro.desde && v.fecha < reportesFiltro.desde) return false;
    if(reportesFiltro.hasta && v.fecha > reportesFiltro.hasta) return false;
    if(reportesFiltro.perfumeId !== 'todos' && v.perfumeId !== reportesFiltro.perfumeId) return false;
    return true;
  });
  const ingresosFiltrados = filtradas.reduce((s,v)=>s+v.total,0);
  const mlFiltrados = filtradas.reduce((s,v)=>s+v.ml,0);
  const porDia = {};
  filtradas.forEach(v=>{ (porDia[v.fecha] = porDia[v.fecha] || []).push(v); });
  const diasConVentas = Object.keys(porDia).sort((a,b)=> new Date(b) - new Date(a));

  el.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Reportes</div><h1>Desempeño de tu negocio</h1></div></div>

    <div class="grid grid-3" style="margin-bottom:26px;">
      <div class="stat"><div class="label">Ingresos totales</div><div class="value">${money(totalGeneral)}</div><div class="sub">${state.ventas.length} venta(s) registradas</div></div>
      <div class="stat"><div class="label">Mililitros vendidos</div><div class="value">${ml(mlTotalVendidos)}</div></div>
      <div class="stat"><div class="label">Turnos cerrados</div><div class="value">${turnosCerrados.length}</div></div>
    </div>

    <div class="section-title">Ventas — últimos 7 días</div>
    <div class="card" style="margin-bottom:26px;">
      <div class="bar-chart">
        ${dias.map((d,i)=>`
          <div class="bar-col">
            <div class="bar-value">${totalesPorDia[i]>0?money(totalesPorDia[i]):''}</div>
            <div class="bar" style="height:${Math.max(3,(totalesPorDia[i]/maxTotal)*100)}%;"></div>
            <div class="bar-label">${new Date(d+'T00:00:00').toLocaleDateString('es-MX',{weekday:'short'})}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="section-title">Consultar por fecha y producto</div>
    <div class="card" style="margin-bottom:20px;">
      <div class="field-row">
        <div class="field" style="margin-bottom:0;"><label>Desde</label><input type="date" id="repDesde" value="${reportesFiltro.desde}"></div>
        <div class="field" style="margin-bottom:0;"><label>Hasta</label><input type="date" id="repHasta" value="${reportesFiltro.hasta}"></div>
      </div>
      <div class="field" style="margin-top:12px;margin-bottom:0;">
        <label>Producto</label>
        <select id="repProducto">
          <option value="todos" ${reportesFiltro.perfumeId==='todos'?'selected':''}>Todos los perfumes</option>
          ${state.perfumes.map(p=>`<option value="${p.id}" ${reportesFiltro.perfumeId===p.id?'selected':''}>${p.nombre}</option>`).join('')}
        </select>
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-outline btn-sm" id="repLimpiar"><i class="ti ti-x"></i> Limpiar filtro</button>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="stat accent"><div class="label">Ingresos en el rango</div><div class="value">${money(ingresosFiltrados)}</div><div class="sub">${filtradas.length} venta(s)</div></div>
      <div class="stat"><div class="label">Mililitros vendidos</div><div class="value">${ml(mlFiltrados)}</div></div>
      <div class="stat"><div class="label">Días con ventas</div><div class="value">${diasConVentas.length}</div></div>
    </div>

    ${diasConVentas.length ? diasConVentas.map(fecha=>{
      const ventasDia = porDia[fecha].slice().sort((a,b)=> new Date(b.hora) - new Date(a.hora));
      const totalDia = ventasDia.reduce((s,v)=>s+v.total,0);
      const mlDia = ventasDia.reduce((s,v)=>s+v.ml,0);
      return `
      <div class="card" style="margin-bottom:14px;">
        <div class="flex-between" style="margin-bottom:10px;">
          <div style="font-weight:700;">${fmtDate(fecha)}</div>
          <div class="num" style="font-weight:700;">${money(totalDia)} · ${ml(mlDia)}</div>
        </div>
        <table>
          <thead><tr><th>Hora</th><th>Perfume</th><th>Tipo</th><th>ml</th><th>Pago</th><th>Total</th></tr></thead>
          <tbody>
            ${ventasDia.map(v=>`<tr>
              <td>${fmtTime(v.hora)}</td>
              <td>${v.perfumeNombre}</td>
              <td class="muted" style="font-size:11.5px;">${v.tipo}</td>
              <td class="num">${ml(v.ml)}</td>
              <td><span class="pay-badge pay-${v.metodoPago}">${v.metodoPago==='efectivo'?'Efectivo':'Transferencia'}</span></td>
              <td class="num" style="font-weight:700;">${money(v.total)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }).join('') : `<div class="empty card" style="margin-bottom:24px;"><i class="ti ti-calendar-search"></i><h3>Sin ventas en ese filtro</h3><p>Prueba con otro rango de fechas o producto.</p></div>`}

    <div class="grid grid-2" style="grid-template-columns:1fr 1fr;align-items:start;margin-top:6px;">
      <div>
        <div class="section-title">Perfumes más vendidos · margen real</div>
        <div class="table-wrap">
          <table><thead><tr><th>Perfume</th><th>ml</th><th>Ingresos</th><th>Ganancia neta</th><th>Margen</th></tr></thead>
          <tbody>${topPerfumes.length ? topPerfumes.map(({p,g})=>`<tr>
            <td>${p.nombre}</td>
            <td class="num">${ml(g.ingresos>0 ? state.ventas.filter(v=>v.perfumeId===p.id).reduce((s,v)=>s+v.ml,0) : 0)}</td>
            <td class="num" style="font-weight:700;">${money(g.ingresos)}</td>
            <td class="num" style="color:${g.gananciaNeta<0?'var(--danger)':'var(--success)'};">${money(g.gananciaNeta)}</td>
            <td class="num">${g.margenNeto.toFixed(1)}%</td>
          </tr>`).join('') : `<tr><td colspan="5" class="center muted" style="padding:20px;">Sin ventas aún</td></tr>`}</tbody>
          </table>
        </div>
      </div>
      <div>
        <div class="section-title">Historial de turnos</div>
        <div class="table-wrap">
          <table><thead><tr><th>Fecha</th><th>Total</th><th>Diferencia</th></tr></thead>
          <tbody>${turnosCerrados.length ? turnosCerrados.slice(0,10).map(t=>`<tr>
            <td>${fmtDate(t.fecha)}</td><td class="num" style="font-weight:700;">${money(t.totalVentas)}</td>
            <td class="num" style="color:${t.diferencia<0?'var(--danger)':t.diferencia>0?'var(--success)':'inherit'}">${t.diferencia>0?'+':''}${money(t.diferencia)}</td>
          </tr>`).join('') : `<tr><td colspan="3" class="center muted" style="padding:20px;">Sin turnos cerrados aún</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById('repDesde').onchange = (e)=>{ reportesFiltro.desde = e.target.value; renderReportes(); };
  document.getElementById('repHasta').onchange = (e)=>{ reportesFiltro.hasta = e.target.value; renderReportes(); };
  document.getElementById('repProducto').onchange = (e)=>{ reportesFiltro.perfumeId = e.target.value; renderReportes(); };
  document.getElementById('repLimpiar').onclick = ()=>{ reportesFiltro = {desde:'', hasta:'', perfumeId:'todos'}; renderReportes(); };
}

/* ============================================================
   CONFIGURACIÓN
============================================================ */
const paletteOptions = ['#c69a3e','#b5677d','#2c4c5c','#4a2545','#7a8c5c','#8a5a3f'];

function renderConfig(){
  const el = document.getElementById('view-config');
  el.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Configuración</div><h1>Tu marca</h1><p>Personaliza el nombre, logo y color de tu negocio.</p></div></div>

    <div class="card">
      <div class="field"><label>Nombre del negocio</label><input id="cNombre" value="${state.config.nombreNegocio}"></div>
        <div class="field">
          <label>Logo</label>
          <div class="logo-upload">
            ${state.config.logo ? `<img class="logo-preview" src="${state.config.logo}">` : `<div class="logo-preview center" style="display:flex;align-items:center;justify-content:center;"><i class="ti ti-photo" style="color:var(--muted);"></i></div>`}
            <div>
              <input type="file" id="cLogo" accept="image/*" style="display:none;">
              <button class="btn btn-outline btn-sm" id="cLogoBtn">Subir imagen</button>
              ${state.config.logo ? `<button class="btn btn-outline btn-sm" id="cLogoRemove" style="margin-left:6px;">Quitar</button>` : ''}
            </div>
          </div>
        </div>
        <div class="field">
          <label>Color de acento</label>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            ${paletteOptions.map(c=>`<button class="color-swatch ${state.config.colorAcento===c?'active':''}" data-color="${c}" style="background:${c};"></button>`).join('')}
            <input type="color" id="cColorCustom" value="${state.config.colorAcento}" style="width:34px;height:34px;padding:0;border:none;border-radius:50%;background:none;">
          </div>
        </div>
        <button class="btn btn-gold" id="cSave" style="margin-top:6px;"><i class="ti ti-check"></i> Guardar cambios</button>
    </div>

    <div class="section-title">Multi-dispositivo</div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:6px;">
        <h3 style="margin:0;">Sincronización en la nube (Supabase)</h3>
        <span id="cloudStatusTag">${cloudConfigured() ? '<span class="tag tag-ok">Conectado</span>' : '<span class="tag tag-low">Sin conectar</span>'}</span>
      </div>
      <p class="muted" style="font-size:13px;">Conecta tu propio proyecto de Supabase para que el inventario, ventas, turnos y pedidos se vean iguales en tu computadora y en tu celular.</p>
      <div class="field-row">
        <div class="field"><label>Project URL</label><input id="cCloudUrl" value="${state.config.cloud.url}" placeholder="https://xxxxx.supabase.co"></div>
        <div class="field"><label>Anon public key</label><input id="cCloudKey" value="${state.config.cloud.key}" placeholder="eyJhbGciOi..."></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-gold btn-sm" id="cCloudConnect"><i class="ti ti-cloud-check"></i> ${cloudConfigured() ? 'Reconectar' : 'Conectar y sincronizar'}</button>
        ${cloudConfigured() ? `<button class="btn btn-outline btn-sm" id="cCloudSyncNow"><i class="ti ti-refresh"></i> Sincronizar ahora</button>
        <button class="btn btn-outline btn-sm" id="cCloudDisconnect"><i class="ti ti-cloud-off"></i> Desconectar</button>` : ''}
      </div>
      <div class="hint" style="margin-top:10px;">${cloudConfigured() ? 'Última sincronización: ' + (state.config.cloud.lastSync ? fmtTime(state.config.cloud.lastSync) : '—') : 'Sin conexión — la app sigue funcionando normal, solo en este dispositivo.'}</div>
    </div>
    <div class="grid grid-2" style="grid-template-columns:1fr;margin-top:16px;max-width:560px;">
      <div class="card">
        <h3 style="margin-top:0;">Respaldo de datos</h3>
        <p class="muted" style="font-size:13px;">Tus datos viven en este navegador. Exporta un respaldo periódicamente para no perder información.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
          <button class="btn btn-outline" id="cExport"><i class="ti ti-download"></i> Exportar respaldo</button>
          <button class="btn btn-outline" id="cImportBtn"><i class="ti ti-upload"></i> Importar respaldo</button>
          <input type="file" id="cImport" accept="application/json" style="display:none;">
        </div>
        <div class="divider"></div>
        <h3 style="color:var(--danger);">Zona de riesgo</h3>
        <p class="muted" style="font-size:13px;">Borra todos los perfumes, ventas y turnos. No se puede deshacer.</p>
        <button class="btn btn-danger" id="cReset"><i class="ti ti-trash"></i> Borrar todos los datos</button>
      </div>
    </div>
  `;

  document.getElementById('cCloudConnect').onclick = async ()=>{
    const url = document.getElementById('cCloudUrl').value.trim();
    const key = document.getElementById('cCloudKey').value.trim();
    if(!url || !key){ toast('Pega la URL y la llave anon de tu proyecto', 'err'); return; }
    const btn = document.getElementById('cCloudConnect');
    btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Conectando…';
    const ok = await conectarNube(url, key);
    if(ok){ renderConfig(); updateSyncBadge(); if(currentView && currentView!=='config') renderers[currentView](); }
    else { btn.disabled = false; btn.innerHTML = '<i class="ti ti-cloud-check"></i> Conectar y sincronizar'; }
  };
  const syncNowBtn = document.getElementById('cCloudSyncNow');
  if(syncNowBtn) syncNowBtn.onclick = async ()=>{
    try{ const row = await sbPush(); state.config.cloud.lastSync = row.updated_at; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); toast('Sincronizado', 'ok'); renderConfig(); updateSyncBadge(); }
    catch(err){ toast(err.message || 'Error al sincronizar', 'err'); }
  };
  const disconnectBtn = document.getElementById('cCloudDisconnect');
  if(disconnectBtn) disconnectBtn.onclick = ()=>{ desconectarNube(); renderConfig(); };

  let pendingLogo = state.config.logo;
  let pendingColor = state.config.colorAcento;

  document.getElementById('cLogoBtn').onclick = ()=>document.getElementById('cLogo').click();
  document.getElementById('cLogo').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ pendingLogo = reader.result; document.querySelector('.logo-preview').outerHTML = `<img class="logo-preview" src="${pendingLogo}">`; };
    reader.readAsDataURL(file);
  };
  const removeBtn = document.getElementById('cLogoRemove');
  if(removeBtn) removeBtn.onclick = ()=>{ pendingLogo=''; renderConfig(); };

  el.querySelectorAll('[data-color]').forEach(sw=>{
    sw.onclick = ()=>{ pendingColor = sw.dataset.color; el.querySelectorAll('[data-color]').forEach(s=>s.classList.remove('active')); sw.classList.add('active'); };
  });
  document.getElementById('cColorCustom').oninput = (e)=>{ pendingColor = e.target.value; };

  document.getElementById('cSave').onclick = ()=>{
    state.config.nombreNegocio = document.getElementById('cNombre').value.trim() || 'Mi Perfumería';
    state.config.logo = pendingLogo;
    state.config.colorAcento = pendingColor;
    saveState();
    applyTheme();
    toast('Configuración guardada', 'ok');
  };

  document.getElementById('cExport').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `respaldo-${state.config.nombreNegocio.replace(/\s+/g,'-').toLowerCase()}-${todayStr()}.json`;
    a.click();
  };
  document.getElementById('cImportBtn').onclick = ()=>document.getElementById('cImport').click();
  document.getElementById('cImport').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(confirm('Esto reemplazará todos tus datos actuales con los del respaldo. ¿Continuar?')){
          state = Object.assign(structuredClone(defaultState), imported);
          saveState();
          applyTheme();
          toast('Respaldo importado', 'ok');
          goTo('dashboard');
        }
      }catch(err){ toast('El archivo no es un respaldo válido', 'err'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('cReset').onclick = ()=>{
    if(confirm('¿Seguro que quieres borrar TODOS los datos (perfumes, ventas y turnos)? Esta acción no se puede deshacer.')){
      state.perfumes = []; state.ventas = []; state.turnos = [];
      saveState();
      toast('Datos borrados', 'ok');
      goTo('dashboard');
    }
  };
}

/* ============================================================
   MODAL HELPERS
============================================================ */
function showModal(innerHtml, wide){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal ${wide?'wide':''}">${innerHtml}</div>
    </div>`;
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
function wireModalClose(){
  document.getElementById('mClose').onclick = closeModal;
  const cancel = document.getElementById('mCancel');
  if(cancel) cancel.onclick = closeModal;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
}

/* ============================================================
   INICIO
============================================================ */
applyTheme();
updateSyncBadge();
if(cloudConfigured()) startCloudPolling();
goTo('dashboard');

// Registro del service worker — solo aplica cuando la app corre en un
// navegador servido por https (GitHub Pages, etc). En el ejecutable de
// escritorio (Tauri) simplemente no hace nada, sin generar errores.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
